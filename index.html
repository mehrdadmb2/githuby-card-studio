<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHuby Invite &amp; Card Studio</title>

  <!-- ======== CDN Libraries ======== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&amp;family=Amiri:wght@400;700&amp;family=Lalezar&amp;family=Vazirmatn:wght@300;400;700&amp;family=ElMessiri:wght@400;700&amp;display=swap" />
  <!-- Leaflet for map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- html2canvas for image export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* ============================================================
       RESET & BASE
    ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      font-family: 'Vazirmatn', 'Cairo', sans-serif;
      min-height: 100vh;
      background: #0b0e14;
      color: #eee;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* ---- Dynamic Background (particles + gradient) ---- */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 30px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ---- Header ---- */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 15px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .header-controls select,
    .header-controls button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #eee;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.95rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      font-family: inherit;
    }

    .header-controls select option {
      background: #1e1e2a;
      color: #eee;
    }

    .header-controls button {
      background: rgba(255, 255, 255, 0.12);
      transition: 0.2s;
    }

    .header-controls button:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.03);
    }

    /* ---- Main Grid ---- */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }

    /* ---- Form Panel ---- */
    .form-panel {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 28px;
      padding: 24px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .form-panel h2 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 400;
      font-size: 0.9rem;
      margin-bottom: 5px;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: 0.25s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #f5576c;
      box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.2);
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    /* ---- Map container ---- */
    #map {
      height: 200px;
      border-radius: 16px;
      margin-top: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .coord-inputs {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .coord-inputs input {
      flex: 1;
    }

    /* ---- Mood & Weather badges ---- */
    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .badge-group .badge-option {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-group .badge-option.active {
      background: rgba(245, 87, 108, 0.3);
      border-color: #f5576c;
      box-shadow: 0 0 12px rgba(245, 87, 108, 0.2);
    }

    .badge-group .badge-option:hover {
      transform: scale(1.04);
    }

    /* ---- Preview Panel ---- */
    .preview-panel {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 28px;
      padding: 24px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .preview-header h2 {
      font-size: 1.4rem;
    }

    .preview-actions button {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 30px;
      margin-left: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .preview-actions button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ---- The actual Card (Preview) ---- */
    #card-preview {
      background: linear-gradient(145deg, #1e1e2f, #2a2a3e);
      border-radius: 32px;
      padding: 28px;
      min-height: 380px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      transition: all 0.4s;
      position: relative;
      overflow: hidden;
      flex: 1;
    }

    #card-preview .card-bg-pattern {
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.02) 0%, transparent 70%);
      pointer-events: none;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .card-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 0.95rem;
      opacity: 0.7;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-body {
      font-size: 1.05rem;
      line-height: 1.7;
      white-space: pre-wrap;
      flex: 1;
    }

    .card-footer {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }

    .card-footer .location {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-footer .datetime {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ---- Emoji picker (simple) ---- */
    .emoji-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0;
    }

    .emoji-picker span {
      font-size: 1.6rem;
      cursor: pointer;
      transition: 0.15s;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 8px;
      border-radius: 12px;
    }

    .emoji-picker span:hover {
      transform: scale(1.25);
      background: rgba(255, 255, 255, 0.12);
    }

    /* ---- Responsive tweaks ---- */
    @media (max-width: 700px) {
      .app-wrapper {
        padding: 16px;
      }
      .header h1 {
        font-size: 1.5rem;
      }
      .form-panel,
      .preview-panel {
        padding: 16px;
      }
    }

    /* ====== GLASSMORPHISM THEME ====== */
    .theme-glass #card-preview {
      background: rgba(255, 255, 255, 0.08) !important;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    /* ====== DARK THEME (default) ====== */
    body.dark-theme {
      background: #0b0e14;
    }

    /* ====== LIGHT THEME ====== */
    body.light-theme {
      background: #f0f2f5;
      color: #111;
    }
    body.light-theme .app-wrapper {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(12px);
      border-color: rgba(0, 0, 0, 0.05);
    }
    body.light-theme .form-panel,
    body.light-theme .preview-panel {
      background: rgba(255, 255, 255, 0.5);
      border-color: rgba(0, 0, 0, 0.05);
    }
    body.light-theme .form-group input,
    body.light-theme .form-group textarea,
    body.light-theme .form-group select {
      background: rgba(255, 255, 255, 0.6);
      color: #111;
      border-color: rgba(0, 0, 0, 0.1);
    }
    body.light-theme .header-controls select,
    body.light-theme .header-controls button {
      background: rgba(0, 0, 0, 0.05);
      color: #111;
      border-color: rgba(0, 0, 0, 0.08);
    }
    body.light-theme #card-preview {
      background: #fff !important;
      color: #111;
      border-color: rgba(0, 0, 0, 0.05);
    }
    body.light-theme .card-footer {
      border-top-color: rgba(0, 0, 0, 0.08);
    }
    body.light-theme .badge-group .badge-option {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.06);
    }
    body.light-theme .badge-group .badge-option.active {
      background: rgba(245, 87, 108, 0.15);
      border-color: #f5576c;
    }

    /* ====== Scroll ====== */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #f5576c;
      border-radius: 12px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
  </style>
</head>
<body>

  <!-- ====== BACKGROUND ANIMATION CANVAS ====== -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-wrapper">
    <!-- ====== HEADER ====== -->
    <header class="header">
      <h1><i class="fas fa-envelope-open-text"></i> GitHuby Card Studio</h1>
      <div class="header-controls">
        <select id="themeSelect">
          <option value="dark">🌙 دارک</option>
          <option value="light">☀️ لایت</option>
          <option value="glass">🧊 گلس مورفیسم</option>
        </select>
        <select id="fontSelect">
          <option value="Vazirmatn">وزیرمتن</option>
          <option value="Cairo">قاهره</option>
          <option value="Amiri">امیری</option>
          <option value="Lalezar">لاله‌زار</option>
          <option value="ElMessiri">المسیری</option>
        </select>
        <button id="resetBtn"><i class="fas fa-undo-alt"></i> ریست</button>
      </div>
    </header>

    <!-- ====== MAIN GRID ====== -->
    <div class="main-grid">
      <!-- ====== FORM PANEL ====== -->
      <section class="form-panel">
        <h2><i class="fas fa-pen-fancy"></i> اطلاعات کارت</h2>

        <!-- Event Type -->
        <div class="form-group">
          <label>نوع رویداد</label>
          <select id="eventType">
            <option value="invite">🎉 دعوت</option>
            <option value="reconcile">🤝 آشتی</option>
            <option value="birthday">🎂 تولد</option>
            <option value="outing">🚗 برنامه سفر</option>
            <option value="note">📝 یادداشت</option>
            <option value="poem">📜 شعر</option>
            <option value="art">🎨 اثر هنری</option>
          </select>
        </div>

        <!-- Title -->
        <div class="form-group">
          <label>عنوان</label>
          <input type="text" id="cardTitle" placeholder="مثلاً: دعوت به شام" />
        </div>

        <!-- Description / Text -->
        <div class="form-group">
          <label>متن اصلی</label>
          <textarea id="cardText" placeholder="متن دعوت، شعر یا یادداشت شما ..."></textarea>
        </div>

        <!-- Date & Time -->
        <div class="form-row">
          <div class="form-group">
            <label>تاریخ</label>
            <input type="date" id="cardDate" />
          </div>
          <div class="form-group">
            <label>ساعت</label>
            <input type="time" id="cardTime" />
          </div>
        </div>

        <!-- Location -->
        <div class="form-group">
          <label>📍 لوکیشن</label>
          <input type="text" id="cardLocation" placeholder="آدرس یا نام مکان" />
          <div id="map"></div>
          <div class="coord-inputs">
            <input type="text" id="latInput" placeholder="عرض (Lat)" />
            <input type="text" id="lngInput" placeholder="طول (Lng)" />
          </div>
        </div>

        <!-- Mood -->
        <div class="form-group">
          <label>وضعیت روحی</label>
          <div class="badge-group" id="moodGroup">
            <span class="badge-option active" data-mood="happy">😊 خوب</span>
            <span class="badge-option" data-mood="kind">🥰 مهربون</span>
            <span class="badge-option" data-mood="angry">😤 عصبی</span>
            <span class="badge-option" data-mood="bored">😑 بی‌حوصله</span>
          </div>
        </div>

        <!-- Weather -->
        <div class="form-group">
          <label>آب و هوا</label>
          <div class="badge-group" id="weatherGroup">
            <span class="badge-option active" data-weather="sunny">☀️ آفتابی</span>
            <span class="badge-option" data-weather="cloudy">☁️ ابری</span>
            <span class="badge-option" data-weather="rainy">🌧️ بارانی</span>
            <span class="badge-option" data-weather="snowy">❄️ برفی</span>
          </div>
        </div>

        <!-- Emoji Picker (quick) -->
        <div class="form-group">
          <label>ایموجی تزیینی (کلیک کنید)</label>
          <div class="emoji-picker" id="emojiPicker">
            <span>❤️</span><span>🎈</span><span>🌟</span><span>💎</span><span>🌸</span>
            <span>🔥</span><span>🌈</span><span>⭐</span><span>🎁</span><span>🍀</span>
            <span>✨</span><span>💫</span><span>🎵</span><span>📌</span><span>💌</span>
          </div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;" id="selectedEmojis"></div>
        </div>

      </section>

      <!-- ====== PREVIEW PANEL ====== -->
      <section class="preview-panel">
        <div class="preview-header">
          <h2><i class="fas fa-eye"></i> پیش‌نمایش</h2>
          <div class="preview-actions">
            <button id="downloadImageBtn"><i class="fas fa-image"></i> PNG</button>
            <button id="downloadPdfBtn"><i class="fas fa-file-pdf"></i> PDF</button>
            <button id="printBtn"><i class="fas fa-print"></i> چاپ</button>
          </div>
        </div>

        <!-- ====== CARD PREVIEW ====== -->
        <div id="card-preview">
          <div class="card-bg-pattern"></div>
          <div class="card-content">
            <div class="card-title" id="previewTitle">عنوان کارت</div>
            <div class="card-sub" id="previewSub">
              <span id="previewEvent">🎉 دعوت</span>
              <span class="card-badge" id="previewMood">😊 خوب</span>
              <span class="card-badge" id="previewWeather">☀️</span>
            </div>
            <div class="card-body" id="previewText">متن شما اینجا نمایش داده می‌شود ...</div>
            <div class="card-footer">
              <span class="location"><i class="fas fa-map-pin"></i> <span id="previewLocation">تهران</span></span>
              <span class="datetime"><i class="far fa-calendar-alt"></i> <span id="previewDatetime">۱۴۰۴/۰۱/۰۱ ۲۰:۰۰</span></span>
            </div>
            <div id="previewEmojis" style="margin-top:8px;font-size:1.8rem;display:flex;gap:6px;"></div>
          </div>
        </div>

        <p style="margin-top:12px;font-size:0.8rem;opacity:0.5;text-align:center;">
          <i class="fas fa-sync-alt"></i> تغییرات به‌طور خودکار ذخیره می‌شوند.
        </p>
      </section>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ============================================================
      //  ELEMENTS
      // ============================================================
      const cardTitle = document.getElementById('cardTitle');
      const cardText = document.getElementById('cardText');
      const cardDate = document.getElementById('cardDate');
      const cardTime = document.getElementById('cardTime');
      const cardLocation = document.getElementById('cardLocation');
      const latInput = document.getElementById('latInput');
      const lngInput = document.getElementById('lngInput');
      const eventType = document.getElementById('eventType');
      const themeSelect = document.getElementById('themeSelect');
      const fontSelect = document.getElementById('fontSelect');
      const resetBtn = document.getElementById('resetBtn');

      const previewTitle = document.getElementById('previewTitle');
      const previewEvent = document.getElementById('previewEvent');
      const previewMood = document.getElementById('previewMood');
      const previewWeather = document.getElementById('previewWeather');
      const previewText = document.getElementById('previewText');
      const previewLocation = document.getElementById('previewLocation');
      const previewDatetime = document.getElementById('previewDatetime');
      const previewEmojis = document.getElementById('previewEmojis');
      const cardPreview = document.getElementById('card-preview');

      const moodOptions = document.querySelectorAll('#moodGroup .badge-option');
      const weatherOptions = document.querySelectorAll('#weatherGroup .badge-option');
      const emojiPicker = document.getElementById('emojiPicker');
      const selectedEmojis = document.getElementById('selectedEmojis');

      // ============================================================
      //  STATE
      // ============================================================
      let currentMood = 'happy';
      let currentWeather = 'sunny';
      let selectedEmojiList = [];

      // ============================================================
      //  MAP (Leaflet)
      // ============================================================
      let mapInstance = null;
      let marker = null;

      function initMap() {
        if (mapInstance) {
          mapInstance.invalidateSize();
          return;
        }
        mapInstance = L.map('map').setView([35.6892, 51.3890], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors'
        }).addTo(mapInstance);
        marker = L.marker([35.6892, 51.3890], { draggable: true }).addTo(mapInstance);

        marker.on('dragend', function(e) {
          const pos = marker.getLatLng();
          latInput.value = pos.lat.toFixed(6);
          lngInput.value = pos.lng.toFixed(6);
          updatePreview();
        });

        mapInstance.on('click', function(e) {
          const lat = e.latlng.lat;
          const lng = e.latlng.lng;
          marker.setLatLng([lat, lng]);
          latInput.value = lat.toFixed(6);
          lngInput.value = lng.toFixed(6);
          updatePreview();
        });

        // reverse geocode on marker drag end? we can do a simple fetch
        // but we'll keep it manual for simplicity.
      }

      // update map from lat/lng inputs
      function updateMapFromCoords() {
        const lat = parseFloat(latInput.value);
        const lng = parseFloat(lngInput.value);
        if (!isNaN(lat) && !isNaN(lng)) {
          if (mapInstance) {
            mapInstance.setView([lat, lng], 13);
            marker.setLatLng([lat, lng]);
          }
        }
      }

      // ============================================================
      //  UPDATE PREVIEW
      // ============================================================
      function updatePreview() {
        // Title
        previewTitle.textContent = cardTitle.value || 'بدون عنوان';

        // Event
        const eventMap = {
          invite: '🎉 دعوت',
          reconcile: '🤝 آشتی',
          birthday: '🎂 تولد',
          outing: '🚗 برنامه سفر',
          note: '📝 یادداشت',
          poem: '📜 شعر',
          art: '🎨 اثر هنری'
        };
        previewEvent.textContent = eventMap[eventType.value] || 'رویداد';

        // Text
        previewText.textContent = cardText.value || 'متن خود را وارد کنید ...';

        // Location
        previewLocation.textContent = cardLocation.value || 'مکان نامشخص';

        // Date & Time
        let dateVal = cardDate.value;
        let timeVal = cardTime.value;
        if (dateVal && timeVal) {
          const d = new Date(dateVal + 'T' + timeVal);
          previewDatetime.textContent = d.toLocaleDateString('fa-IR') + ' ' + d.toLocaleTimeString('fa-IR', { hour: '2-digit',
            minute: '2-digit' });
        } else if (dateVal) {
          const d = new Date(dateVal);
          previewDatetime.textContent = d.toLocaleDateString('fa-IR');
        } else {
          previewDatetime.textContent = 'تاریخ و ساعت مشخص نشده';
        }

        // Mood & Weather (badges)
        const moodMap = { happy: '😊 خوب', kind: '🥰 مهربون', angry: '😤 عصبی', bored: '😑 بی‌حوصله' };
        previewMood.textContent = moodMap[currentMood] || '😊 خوب';

        const weatherMap = { sunny: '☀️ آفتابی', cloudy: '☁️ ابری', rainy: '🌧️ بارانی', snowy: '❄️ برفی' };
        previewWeather.textContent = weatherMap[currentWeather] || '☀️';

        // Emojis
        previewEmojis.innerHTML = selectedEmojiList.map(e => `<span>${e}</span>`).join('');

        // Apply theme classes to body and preview
        applyTheme(themeSelect.value);

        // Apply font
        cardPreview.style.fontFamily = fontSelect.value + ', sans-serif';

        // Apply mood color accent (just a subtle border)
        const moodColors = {
          happy: '#f093fb',
          kind: '#4facfe',
          angry: '#f5576c',
          bored: '#a8a8b8'
        };
        cardPreview.style.borderColor = moodColors[currentMood] || 'rgba(255,255,255,0.06)';
        cardPreview.style.boxShadow = `0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px ${moodColors[currentMood]}40`;

        // Save state to localStorage
        saveState();
      }

      // ============================================================
      //  THEME ENGINE
      // ============================================================
      function applyTheme(theme) {
        const body = document.body;
        // remove all theme classes
        body.classList.remove('dark-theme', 'light-theme', 'theme-glass');
        if (theme === 'dark') {
          body.classList.add('dark-theme');
          cardPreview.style.background = 'linear-gradient(145deg, #1e1e2f, #2a2a3e)';
          cardPreview.style.color = '#eee';
        } else if (theme === 'light') {
          body.classList.add('light-theme');
          cardPreview.style.background = '#ffffff';
          cardPreview.style.color = '#111';
        } else if (theme === 'glass') {
          body.classList.add('theme-glass');
          cardPreview.style.background = 'rgba(255,255,255,0.08)';
          cardPreview.style.color = '#fff';
          // keep glass effect
        }
        // store
        localStorage.setItem('ghTheme', theme);
      }

      // ============================================================
      //  STATE PERSISTENCE
      // ============================================================
      function saveState() {
        const state = {
          title: cardTitle.value,
          text: cardText.value,
          date: cardDate.value,
          time: cardTime.value,
          location: cardLocation.value,
          lat: latInput.value,
          lng: lngInput.value,
          event: eventType.value,
          mood: currentMood,
          weather: currentWeather,
          emojis: selectedEmojiList,
          theme: themeSelect.value,
          font: fontSelect.value,
        };
        try {
          localStorage.setItem('ghCardState', JSON.stringify(state));
        } catch (e) {}
      }

      function loadState() {
        try {
          const raw = localStorage.getItem('ghCardState');
          if (!raw) return;
          const state = JSON.parse(raw);
          cardTitle.value = state.title || '';
          cardText.value = state.text || '';
          cardDate.value = state.date || '';
          cardTime.value = state.time || '';
          cardLocation.value = state.location || '';
          latInput.value = state.lat || '';
          lngInput.value = state.lng || '';
          eventType.value = state.event || 'invite';
          currentMood = state.mood || 'happy';
          currentWeather = state.weather || 'sunny';
          selectedEmojiList = state.emojis || [];
          themeSelect.value = state.theme || 'dark';
          fontSelect.value = state.font || 'Vazirmatn';

          // sync mood badges
          moodOptions.forEach(el => {
            el.classList.toggle('active', el.dataset.mood === currentMood);
          });
          weatherOptions.forEach(el => {
            el.classList.toggle('active', el.dataset.weather === currentWeather);
          });

          // update emoji display
          renderSelectedEmojis();

          // update map
          updateMapFromCoords();
          updatePreview();
        } catch (e) { /* ignore */ }
      }

      // ============================================================
      //  EMOJI HANDLER
      // ============================================================
      function renderSelectedEmojis() {
        selectedEmojis.innerHTML = selectedEmojiList.map(e =>
          `<span style="font-size:1.8rem;cursor:pointer;" data-emoji="${e}">${e}</span>`
        ).join('');
        // click to remove
        selectedEmojis.querySelectorAll('span').forEach(el => {
          el.addEventListener('click', function() {
            const em = this.dataset.emoji;
            selectedEmojiList = selectedEmojiList.filter(e => e !== em);
            renderSelectedEmojis();
            updatePreview();
          });
        });
      }

      // ============================================================
      //  EXPORT FUNCTIONS (Image, PDF, Print)
      // ============================================================
      function exportImage() {
        const node = document.getElementById('card-preview');
        html2canvas(node, {
          scale: 2,
          useCORS: true,
          backgroundColor: null
        }).then(canvas => {
          const link = document.createElement('a');
          link.download = 'card.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(err => alert('خطا در ساخت تصویر: ' + err));
      }

      function exportPDF() {
        const node = document.getElementById('card-preview');
        html2canvas(node, {
          scale: 2,
          useCORS: true,
          backgroundColor: null
        }).then(canvas => {
          const imgData = canvas.toDataURL('image/png');
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
          pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
          pdf.save('card.pdf');
        }).catch(err => alert('خطا در ساخت PDF: ' + err));
      }

      function printCard() {
        window.print();
      }

      // ============================================================
      //  RESET
      // ============================================================
      function resetAll() {
        cardTitle.value = '';
        cardText.value = '';
        cardDate.value = '';
        cardTime.value = '';
        cardLocation.value = '';
        latInput.value = '';
        lngInput.value = '';
        eventType.value = 'invite';
        currentMood = 'happy';
        currentWeather = 'sunny';
        selectedEmojiList = [];
        themeSelect.value = 'dark';
        fontSelect.value = 'Vazirmatn';

        moodOptions.forEach(el => el.classList.toggle('active', el.dataset.mood === 'happy'));
        weatherOptions.forEach(el => el.classList.toggle('active', el.dataset.weather === 'sunny'));
        renderSelectedEmojis();
        if (mapInstance) {
          mapInstance.setView([35.6892, 51.3890], 13);
          marker.setLatLng([35.6892, 51.3890]);
        }
        localStorage.removeItem('ghCardState');
        updatePreview();
      }

      // ============================================================
      //  EVENT LISTENERS
      // ============================================================
      // Inputs
      cardTitle.addEventListener('input', updatePreview);
      cardText.addEventListener('input', updatePreview);
      cardDate.addEventListener('input', updatePreview);
      cardTime.addEventListener('input', updatePreview);
      cardLocation.addEventListener('input', updatePreview);
      latInput.addEventListener('input', function() {
        updateMapFromCoords();
        updatePreview();
      });
      lngInput.addEventListener('input', function() {
        updateMapFromCoords();
        updatePreview();
      });
      eventType.addEventListener('change', updatePreview);
      themeSelect.addEventListener('change', function() {
        applyTheme(this.value);
        updatePreview();
        saveState();
      });
      fontSelect.addEventListener('change', function() {
        updatePreview();
        saveState();
      });

      // Mood
      moodOptions.forEach(el => {
        el.addEventListener('click', function() {
          moodOptions.forEach(o => o.classList.remove('active'));
          this.classList.add('active');
          currentMood = this.dataset.mood;
          updatePreview();
        });
      });

      // Weather
      weatherOptions.forEach(el => {
        el.addEventListener('click', function() {
          weatherOptions.forEach(o => o.classList.remove('active'));
          this.classList.add('active');
          currentWeather = this.dataset.weather;
          updatePreview();
        });
      });

      // Emoji picker
      emojiPicker.querySelectorAll('span').forEach(el => {
        el.addEventListener('click', function() {
          const em = this.textContent;
          if (!selectedEmojiList.includes(em)) {
            selectedEmojiList.push(em);
            renderSelectedEmojis();
            updatePreview();
          }
        });
      });

      // Export buttons
      document.getElementById('downloadImageBtn').addEventListener('click', exportImage);
      document.getElementById('downloadPdfBtn').addEventListener('click', exportPDF);
      document.getElementById('printBtn').addEventListener('click', printCard);

      // Reset
      resetBtn.addEventListener('click', resetAll);

      // ============================================================
      //  INIT
      // ============================================================
      window.addEventListener('load', function() {
        initMap();
        loadState();
        // set default date
        if (!cardDate.value) {
          const today = new Date().toISOString().split('T')[0];
          cardDate.value = today;
        }
        if (!cardTime.value) {
          const now = new Date();
          cardTime.value = now.toTimeString().slice(0, 5);
        }
        updatePreview();
        // resize map after layout
        setTimeout(() => { if (mapInstance) mapInstance.invalidateSize(); }, 300);
      });

      // ============================================================
      //  BACKGROUND PARTICLES (canvas)
      // ============================================================
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let w, h;

      function resizeCanvas() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      class Particle {
        constructor() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 2.5 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.6;
          this.speedY = (Math.random() - 0.5) * 0.6;
          this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > w) this.speedX *= -1;
          if (this.y < 0 || this.y > h) this.speedY *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
          ctx.fill();
        }
      }

      function initParticles(count = 120) {
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }
      }
      initParticles();

      function animateParticles() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      // Re-init particles on resize
      window.addEventListener('resize', function() {
        resizeCanvas();
        initParticles(120);
      });

      // ============================================================
      //  ADDITIONAL: dynamic gradient background for card preview
      // ============================================================
      // We already have a gradient in the card, but we can add extra
      // using CSS. We'll just keep it.

      console.log('🚀 GitHuby Card Studio loaded successfully!');
    })();
  </script>
</body>
