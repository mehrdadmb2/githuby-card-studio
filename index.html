<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostCard Pro Studio</title>

  <!-- ====== Favicon (logo.png – without background) ====== -->
  <link rel="icon" type="image/png" href="assets/logos/logo.png" />
  <link rel="apple-touch-icon" href="assets/logos/logo.png" />

  <!-- ====== External Libraries ====== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- ====== Main CSS ====== -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Background Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-wrapper" id="appWrapper">
    <!-- Header -->
    <header class="header">
      <h1>
        <!-- Logo in header (logo1.png – with background) -->
        <img src="assets/logos/logo1.png" alt="PostCard Pro Logo" style="height:45px;margin-right:12px;" />
        PostCard Pro
      </h1>
      <div class="header-controls" id="headerControls">
        <!-- Will be populated by JS -->
      </div>
    </header>

    <!-- Main Grid -->
    <div class="main-grid">
      <!-- Left Panel: Controls -->
      <section class="panel" id="controlsPanel">
        <h2><i class="fas fa-sliders-h"></i> Customize</h2>
        <div id="controlsContainer">
          <!-- همه‌ی کنترل‌ها توسط JS ساخته می‌شوند -->
        </div>
      </section>

      <!-- Right Panel: Preview + Templates -->
      <section class="panel" id="previewPanel">
        <h2><i class="fas fa-eye"></i> Preview</h2>
        <div id="export-container">
          <div id="card-preview">
            <div class="card-bg-pattern"></div>
            <div class="card-content">
              <div class="card-title" id="previewTitle">Your Title</div>
              <div class="card-sub">
                <span id="previewEvent">🎉 Event</span>
                <span class="card-badge" id="previewMood">😊</span>
                <span class="card-badge" id="previewWeather">☀️</span>
              </div>
              <div class="card-body" id="previewText">Write your message...</div>
              <div class="card-footer">
                <span class="location"><i class="fas fa-map-pin"></i> <span id="previewLocation">Location</span></span>
                <span class="datetime"><i class="far fa-calendar-alt"></i> <span id="previewDatetime">Date</span></span>
              </div>
              <div id="previewEmojis"></div>
            </div>
          </div>
        </div>

        <div class="preview-actions">
          <button id="downloadImageBtn"><i class="fas fa-image"></i> PNG</button>
          <button id="downloadPdfBtn"><i class="fas fa-file-pdf"></i> PDF</button>
          <button id="printBtn"><i class="fas fa-print"></i> Print</button>
        </div>

        <div style="margin-top:18px;">
          <h3 style="font-size:1rem;margin-bottom:8px;"><i class="fas fa-copy"></i> Quick Templates</h3>
          <div class="template-grid" id="templateGrid"></div>
        </div>
        <p style="margin-top:12px;font-size:0.75rem;opacity:0.4;text-align:center;">Auto-saved in your browser</p>
      </section>
    </div>

    <!-- ====== DONATE CONTAINER ====== -->
    <div id="donateContainer"></div>

  </div> <!-- end app-wrapper -->

  <!-- ====== JavaScript Modules ====== -->
  <script src="js/config.js"></script>
  <script src="js/themeManager.js"></script>
  <script src="js/fontManager.js"></script>
  <script src="js/languageManager.js"></script>
  <script src="js/templateManager.js"></script>
  <script src="js/backgroundManager.js"></script>
  <script src="js/mapManager.js"></script>
  <script src="js/cardManager.js"></script>
  <script src="js/exportManager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
